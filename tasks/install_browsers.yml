---
- name: Download Chrome package
  become: true
  ansible.builtin.get_url:
    url: "https://dl.google.com/linux/direct/google-chrome-stable_current_{{ apt_arch }}.deb"
    dest: /tmp/google-chrome.deb
    mode: '0644'

- name: Install Chrome
  become: true
  ansible.builtin.apt:
    deb: /tmp/google-chrome.deb

- name: Remove Chrome .deb
  become: true
  ansible.builtin.file:
    path: /tmp/google-chrome.deb
    state: absent

- name: Install Firefox (snap)
  become: true
  community.general.snap:
    name: firefox
    state: present

- name: Install Chromium (snap)
  become: true
  community.general.snap:
    name: chromium
    state: present
